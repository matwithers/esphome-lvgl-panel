---
# Switch (or light) toggl
substitutions:
  page_id: "main_page"
  uid: "my_switch"
  row_pos: "0"
  column_pos: "0"
  row_span: "2"
  column_span: "6"
  icon: "${mdi_lightbulb}"
  text: "My Switch"
  entity_id: "light.default"

# This section add a button to LVGL page main_page
lvgl:
  pages:
    - id: !extend ${page_id}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row_pos}
            grid_cell_column_pos: ${column_pos}
            grid_cell_row_span: ${row_span}
            grid_cell_column_span: ${column_span}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}

                  widgets:
                    - container:
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          pad_column: 6
                        widgets:
                          - label:
                              text_font: $icon_font
                              id: icon_${uid}
                              text: ${icon}

                          - label:
                              id: label_${uid}
                              text: ${text}

                on_short_click:
                  - homeassistant.action:
                      action: homeassistant.toggle
                      data:
                        entity_id: ${entity_id}

# This section will update button state and relay states from Home Assistant
binary_sensor:
  - id: widget_sensor_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_${uid}
          then:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: color_primary_text
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: color_background
            - lvgl.widget.update:
                id: label_${uid}
                text_color: color_background
          else:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: color_outline
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: color_secondary_text
            - lvgl.widget.update:
                id: label_${uid}
                text_color: color_secondary_text
