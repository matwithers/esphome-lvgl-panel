# Temperature Widget (to be included inside an existing lvgl page widgets list)
#
# vars:
#   row_pos, column_pos, row_span, column_span

container:
    grid_cell_x_align: stretch
    grid_cell_y_align: stretch
    grid_cell_row_pos: ${row_pos}
    grid_cell_column_pos: ${column_pos}
    grid_cell_row_span: ${row_span}
    grid_cell_column_span: ${column_span}
    widgets:
      - obj:
          width: 100%
          height: SIZE_CONTENT
          bg_color: color_background
          radius: 15
          pad_top: 2
          pad_bottom: 2
          layout:
            type: flex
            flex_flow: COLUMN
            flex_align_cross: center
            flex_align_track: center
            pad_row: 2

          widgets:
            - label:
                text: "Climate"
                text_color: color_primary_text
                text_font: font_body_24
                height: SIZE_CONTENT

            - label:
                id: climate_state_indicator
                text: "${mdi_thermometer}"
                text_color: color_primary_text
                text_font: font_mdi_72
                height: SIZE_CONTENT

            - container:
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_cross: center
                  pad_column: 4
                widgets:
                  - label:
                      id: climate_temp_current
                      text: "---°"
                      text_font: font_body_24
                      height: SIZE_CONTENT
                  - label:
                      id: climate_temp_separator
                      text: "/"
                      text_font: font_body_24
                      height: SIZE_CONTENT
                  - label:
                      id: climate_temp_target
                      text: "---°"
                      text_font: font_body_20
                      text_color: nest_heat_orange
                      height: SIZE_CONTENT
