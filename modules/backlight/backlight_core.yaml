---
# BACKLIGHT CORE (Sun-driven, no Night state)
#
# - Day: full brightness
# - Evening: dim brightness
# - Idle behavior (Evening only): off | dim | none
#
# Requires:
# - sun: configured somewhere (latitude/longitude)
# - light id: display_backlight
# - touchscreen id: my_touchscreen (hardware file)

substitutions:
  touchscreen_daytime_brightness: "100%"
  touchscreen_evening_brightness: "50%"
  touchscreen_idle_timeout: "30s"

  # Idle behavior when in Evening:
  # - off  -> backlight off + lvgl.pause
  # - dim  -> backlight to touchscreen_idle_brightness (no pause)
  # - none -> do nothing special
  touchscreen_idle_behavior: "dim"
  touchscreen_idle_brightness: "5%"

  touchscreen_poll_minutes: "1"

# Pick correct mode early after boot
esphome:
  on_boot:
    priority: 200
    then:
      - script.execute: update_brightness_mode_from_sun
      - script.execute: apply_brightness_mode

# Re-evaluate sun state periodically
interval:
  - interval: ${touchscreen_poll_minutes}min
    then:
      - script.execute: update_brightness_mode_from_sun

# Wake on touch (module owns this, not hardware)
touchscreen:
  - id: !extend my_touchscreen
    on_touch:
      then:
        - script.execute: backlight_on_touch

lvgl:
  on_idle:
    timeout: ${touchscreen_idle_timeout}
    then:
      - logger.log:
          level: INFO
          format: "LVGL idle"

      # Only apply idle behavior in Evening
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Evening";'
          then:
            - if:
                condition:
                  lambda: 'return std::string("${touchscreen_idle_behavior}") == "off";'
                then:
                  - light.turn_off: display_backlight
                  - lvgl.pause:
                      show_snow: true
                else:
                  - if:
                      condition:
                        lambda: 'return std::string("${touchscreen_idle_behavior}") == "dim";'
                      then:
                        - light.turn_on:
                            id: display_backlight
                            brightness: ${touchscreen_idle_brightness}
                      else:
                        # "none" -> do nothing
                        - logger.log:
                            level: DEBUG
                            format: "Idle behavior: none"

select:
  - platform: template
    name: "Brightness mode"
    id: brightness_mode
    icon: mdi:television-shimmer
    optimistic: true
    options: [Day, Evening]
    initial_option: Day
    on_value:
      then:
        - lvgl.resume
        - lvgl.widget.redraw
        - script.execute: apply_brightness_mode

script:
  - id: backlight_on_touch
    then:
      - lvgl.resume
      - lvgl.widget.redraw
      - script.execute: apply_brightness_mode

  # Decide mode purely from sun state
  - id: update_brightness_mode_from_sun
    then:
      - if:
          condition:
            sun.is_above_horizon:
          then:
            - if:
                condition:
                  lambda: 'return id(brightness_mode).current_option() != "Day";'
                then:
                  - select.set:
                      id: brightness_mode
                      option: "Day"
          else:
            - if:
                condition:
                  lambda: 'return id(brightness_mode).current_option() != "Evening";'
                then:
                  - select.set:
                      id: brightness_mode
                      option: "Evening"

  # Apply normal brightness for current mode (non-idle)
  - id: apply_brightness_mode
    then:
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Day";'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: ${touchscreen_daytime_brightness}

      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Evening";'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: ${touchscreen_evening_brightness}