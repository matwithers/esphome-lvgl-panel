---
# BACKLIGHT CORE (Sun-driven, no Night state)
#
# - Day: full brightness
# - Evening: dim brightness
# - Optional: blank/pause on LVGL idle when in Evening
#
# Requires:
# - sun component configured somewhere (latitude/longitude)
# - light id: display_backlight
# - hardware touchscreen on_touch calling script.execute: backlight_on_touch

substitutions:
  touchscreen_daytime_brightness: "100%"
  touchscreen_evening_brightness: "50%"
  touchscreen_idle_timeout: "30s"
  touchscreen_enable_blanking: "true"
  touchscreen_poll_minutes: "5"

# Ensure we pick the correct mode early after boot
esphome:
  on_boot:
    priority: 200
    then:
      - script.execute: update_brightness_mode_from_sun
      - script.execute: apply_brightness_mode

# Re-evaluate sun state periodically (configurable)
interval:
  - interval: ${touchscreen_poll_minutes}min
    then:
      - script.execute: update_brightness_mode_from_sun

lvgl:
  on_idle:
    timeout: ${touchscreen_idle_timeout}
    then:
      - logger.log:
          level: INFO
          format: "LVGL idle"

      # Apply brightness first
      - script.execute: apply_brightness_mode

      # Optional blanking (Evening only)
      - if:
          condition:
            lambda: |-
              return std::string("${touchscreen_enable_blanking}") == "true"
                  && id(brightness_mode).current_option() == "Evening";
          then:
            - light.turn_off: display_backlight
            - lvgl.pause:
                show_snow: true

select:
  - platform: template
    name: "Brightness mode"
    id: brightness_mode
    icon: mdi:television-shimmer
    optimistic: true
    options:
      - Day
      - Evening
    initial_option: Day
    on_value:
      then:
        - lvgl.resume
        - lvgl.widget.redraw
        - script.execute: apply_brightness_mode

binary_sensor:
  - id: touchscreen_activity
    on_press:
      then:
        - lvgl.resume
        - lvgl.widget.redraw
        - script.execute: apply_brightness_mode

script:
  # Decide mode purely from sun state
  - id: update_brightness_mode_from_sun
    then:
      - if:
          condition:
            sun.is_above_horizon:
          then:
            - select.set:
                id: brightness_mode
                option: "Day"
          else:
            - select.set:
                id: brightness_mode
                option: "Evening"

  # Apply brightness for current mode
  - id: apply_brightness_mode
    then:
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Day";'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: ${touchscreen_daytime_brightness}

      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Evening";'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: ${touchscreen_evening_brightness}