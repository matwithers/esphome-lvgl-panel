---
# Substitution variables used through the codebase
substitutions:
  device_name: "guition-4848s040"
  device_friendly_name: "Guition 4848s040"
  device_comment: "Guition ESP32-S3-4848S040 480px * 480px Smart Screen"
  display_mode: dark   # or light

packages:
  # Base config
  base: !include esphome-lvgl-panel/common/panel_base.yaml

  # Color theme
  colors: !include esphome-lvgl-panel/common/colors_dark.yaml
  #colors: !include esphome-lvgl-panel/common/colors_light.yaml

  backlight: !include 
    file: esphome-lvgl-panel/modules/backlight/backlight_core.yaml
    vars:
      touchscreen_daytime_brightness: "66%"
      touchscreen_evening_brightness: "33%"

  time_date_widget: !include esphome-lvgl-panel/modules/time_date/time_date_core.yaml

  ev_widget: !include esphome-lvgl-panel/modules/ev/ev_core.yaml

  weather_icons: !include esphome-lvgl-panel/modules/weather/weather_icons.yaml
  weather_core: !include
    file: esphome-lvgl-panel/modules/weather/weather_core.yaml
    vars:
      weather_entity: weather.met_office_totton

  climate_core: !include
    file: esphome-lvgl-panel/modules/climate/climate_core.yaml
    #vars:
    #  enable_temp_override: "true"
    #  temp_override_entity: "sensor.timmerflotte_temp_hmd_sensor_temperature_2"
    #  enable_humidity_override: "true"
    #  humidity_override_entity: "sensor.timmerflotte_temp_hmd_sensor_humidity_2"

  # Our pages go here
  main_page: !include esphome-lvgl-panel/pages/main_page.yaml
  living_room_page: !include esphome-lvgl-panel/pages/living_room.yaml

# Crucial: If you have "lvgl: pages:" here with nothing under it, 
# it might overwrite the work done in the packages. 
# Either list all pages here or leave it out if the packages handle it.
lvgl:

