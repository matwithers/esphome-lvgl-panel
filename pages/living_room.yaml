---
lvgl:
  pages:
    - id: living_room
      layout: 12x12
      styles: page_style
      <<: !include
        file: ../modules/swipe_navigation/swipe_navigation.yaml

      widgets:
        container:
          grid_cell_x_align: stretch
          grid_cell_y_align: stretch
          grid_cell_row_pos: 0
          grid_cell_column_pos: 0
          grid_cell_row_span: 1
          grid_cell_column_span: 6
          widgets:
            - obj:
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_cross: center
                  flex_align_track: center
                  pad_row: 2

                widgets:
                  - label:
                      text: "Living Room"
