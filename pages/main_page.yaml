# MAIN PAGE
#
# 12x12 layout
# Widgets are positioned using row/column spans.
#
# Standard widget size:
#   4 rows × 3 columns
#
# Example grid:
#
#  0                  6                  12
#  +------------------+-------------------+
#  |   Time / Date    |        EV         |
#  +------------------+---------+---------+
#  |     Weather      | Climate | Humidity|
#  +------------------+---------+---------+
#  |         Forecast (full width)        |
#  +--------------------------------------+

- id: main_page
  layout: 12x12
  styles: page_style
  <<: !include esphome-lvgl-panel/modules/swipe_navigation/swipe_navigation.yaml
  bg_color: color_background

  widgets:

    - !include
        file: esphome-lvgl-panel/modules/time_date/time_date_widget.yaml
        vars: { row_pos: "0", column_pos: "0", row_span: "4", column_span: "6" }

    - !include
        file: esphome-lvgl-panel/modules/ev/ev_widget.yaml
        vars: { row_pos: "0", column_pos: "6", row_span: "4", column_span: "6" }

    - !include
        file: esphome-lvgl-panel/modules/weather/weather_now_widget.yaml
        vars: { row_pos: "4", column_pos: "0", row_span: "4", column_span: "6" }

    - !include
        file: esphome-lvgl-panel/modules/climate/climate_widget.yaml
        vars: { row_pos: "4", column_pos: "6", row_span: "4", column_span: "3" }

    - !include
        file: esphome-lvgl-panel/modules/climate/humidity_widget.yaml
        vars: { row_pos: "4", column_pos: "9", row_span: "4", column_span: "3" }

    - !include
        file: esphome-lvgl-panel/modules/weather/weather_forecast_widget.yaml
        vars: { row_pos: "8", column_pos: "0", row_span: "4", column_span: "12" }