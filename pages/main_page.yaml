# MAIN PAGE
#
# 12x12 layout
# Widgets are positioned using row/column spans.
#
# Standard widget size:
#   4 rows × 3 columns
#
# Example grid:
#
#  0                  6                  12
#  +------------------+-------------------+
#  |   Time / Date    |        EV         |
#  +------------------+---------+---------+
#  |     Weather      | Climate | Humidity|
#  +------------------+---------+---------+
#  |         Forecast (full width)        |
#  +--------------------------------------+

- id: main_page
  layout: 12x12
  #styles: page_style
  scrollbar_mode: "OFF"
  bg_color: color_background
  bg_opa: COVER
  pad_all: 1
  <<: !include ../modules/swipe_navigation/swipe_navigation.yaml

  widgets:

    - !include
        file: ../modules/time_date/time_date_widget.yaml
        vars: { row_pos: "0", column_pos: "0", row_span: "4", column_span: "6" }

    - !include
        file: ../modules/ev/ev_widget.yaml
        vars: { row_pos: "0", column_pos: "6", row_span: "4", column_span: "6" }

    - !include
        file: ../modules/weather/weather_now_widget.yaml
        vars: { row_pos: "4", column_pos: "0", row_span: "4", column_span: "6" }

    - !include
        file: ../modules/climate/climate_widget.yaml
        vars: { row_pos: "4", column_pos: "6", row_span: "4", column_span: "3" }

    - !include
        file: ../modules/climate/humidity_widget.yaml
        vars: { row_pos: "4", column_pos: "9", row_span: "4", column_span: "3" }

    - !include
        file: ../modules/weather/weather_forecast_widget.yaml
        vars: { row_pos: "8", column_pos: "0", row_span: "4", column_span: "12" }